services:
  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────

  postgresql:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autonoma
      # postgres:18+ refuses to boot when /var/lib/postgresql/data is itself a
      # mount point, so PGDATA has to point at a subdirectory inside the volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # Temporal
  # ──────────────────────────────────────────────

  temporal:
    image: temporalio/auto-setup:1.25.2
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PWD: postgres
      POSTGRES_SEEDS: postgresql
    ports:
      - "7233:7233"
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      # The server binds the container IP, not loopback, so the CLI needs an
      # explicit --address instead of its 127.0.0.1:7233 default.
      test:
        [
          "CMD",
          "temporal",
          "operator",
          "cluster",
          "health",
          "--address",
          "temporal:7233",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8233:8080"
    depends_on:
      - temporal

  # ──────────────────────────────────────────────
  # API Server
  # ──────────────────────────────────────────────

  api:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm run db:generate && pnpm run api"
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgresql:5432/autonoma
      REDIS_URL: redis://redis:6379
      TEMPORAL_ADDRESS: temporal:7233
      API_PORT: "4000"
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10m
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Frontend
  # ──────────────────────────────────────────────

  ui:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm run ui -- --host 0.0.0.0"
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      API_PROXY_URL: ${API_PROXY_URL:-http://api:4000}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

  # Remote test servers should serve the built SPA instead of exposing Vite's
  # development-only /@fs routes through a corporate network or gateway.
  ui-static:
    profiles: ["server"]
    image: autonoma-ui-static:local
    build:
      context: ./apps/ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      API_UPSTREAM: api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  edge:
    profiles: ["server"]
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/ruijie/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${AUTONOMA_TLS_DIR:-/etc/autonoma/tls}:/etc/nginx/certs:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      ui-static:
        condition: service_started

volumes:
  pgdata:
  redisdata:
  node_modules:
